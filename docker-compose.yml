# 로컬이나 단일 VPS에서 PostgreSQL과 함께 띄우기
# 1) cp .env.example .env.production 후 값 채우기 (DATABASE_URL은 아래 db 서비스에 맞춰 둠)
# 2) docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: think_first
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: think_first
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U think_first"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://think_first:change-me@db:5432/think_first
    depends_on:
      db:
        condition: service_healthy

  # 하루 한 번 pg_dump 로 백업하고 30일 지난 파일은 지운다. 백업은 backups 볼륨에 쌓인다.
  # 외부 저장소(S3 등)로도 보내려면 이 컨테이너에 rclone 등을 더하거나, 호스트 cron 에서 볼륨을 동기화한다.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://think_first:change-me@db:5432/think_first
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "30"
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - backups:/backups
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /pg-backup.sh; sleep $$((BACKUP_INTERVAL_HOURS*3600)); done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
